name: Set up Node and install dependencies
description: Checks nothing out; sets up Node with npm cache and runs npm ci.
inputs:
  node-version:
    description: Node.js version
    default: "24"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
