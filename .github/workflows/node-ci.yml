name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to test on
        type: string
        default: "24"
      run-lint:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        if: inputs.run-lint
        run: npm run lint
      - run: npm test
      - name: Is a secret available?
        run: echo "NPM_TOKEN is set - ${{ secrets.NPM_TOKEN != '' }}"
